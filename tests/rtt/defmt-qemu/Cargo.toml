[package]
name = "fwdefmt"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
defmt = "1"
defmt-semihosting = "0.4"

[profile.release]
debug = 2
opt-level = "s"
codegen-units = 1
lto = "fat"
